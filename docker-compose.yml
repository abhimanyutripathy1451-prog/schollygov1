version: '3.8'

services:
  backend:
    build:
      context: ./schollygov1-backend
      dockerfile: Dockerfile
    container_name: schollygo_backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    # The .env file must be created on your VPS with: DB_HOST, DB_USER, DB_PASSWORD, DB_NAME, DB_PORT, ALLOWED_ORIGINS, etc.
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend/schollygov1
      dockerfile: Dockerfile
      args:
        # Pass the backend URL at build time so Vite can embed it in the static files.
        # Change this in your VPS .env file to your actual backend domain (e.g. https://api.yourdomain.com)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: schollygo_frontend
    restart: always
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend
