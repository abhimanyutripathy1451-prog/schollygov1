server {
    listen 80;
    # You can specify your domain(s) here. E.g., server_name schoolygo.com www.schoolygo.com app.schoolygo.com;
    server_name app.schollygo.com;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Crucial for React/Vue Router (SPA) to work: fallback to index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
        # 'backend' matches the service name in docker-compose.yml
        proxy_pass http://backend:8000/; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Optional: Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        root /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
